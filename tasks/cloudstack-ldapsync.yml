---
# Old and new disagree about what absence from LDAP means: the old script deletes
# those accounts outright.  A node left behind would undo, within the hour, the
# accounts this one is retaining.
- name: "LDAPSYNC: Refuse a partial rollout"
  ansible.builtin.assert:
    that: groups['cloudstack_mgmt'] | difference(ansible_play_hosts) | length == 0
    fail_msg: >-
      {{ groups['cloudstack_mgmt'] | difference(ansible_play_hosts) | join(', ') }}
      would keep the old sync script, which deletes absent accounts outright.
  run_once: true

- name: "LDAPSYNC: APT: Install components for sync script"
  ansible.builtin.apt:
    pkg:
      - "python3-ldap3"
      - "python3-cs"
      - "python3-click"
    state: present

- name: "LDAPSYNC: Install configuration"
  ansible.builtin.template:
    src: cloudstack-ldapsync.conf
    dest: /etc/cloudstack/ldapsync.conf
    owner: root
    mode: "0600"

- name: "LDAPSYNC: Install sync script"
  ansible.builtin.copy:
    src: cloudstack-ldapsync.py
    dest: /usr/local/bin/cloudstack-ldapsync.py
    owner: root
    mode: "0700"

- name: "LDAPSYNC: Perform sync"
  ansible.builtin.command: /usr/local/bin/cloudstack-ldapsync.py
  register: sync
  changed_when: sync.stdout_lines | count > 1
  run_once: true

- name: "LDAPSYNC: Add cron task"
  ansible.builtin.template:
    src: cloudstack-ldapsync.cron
    dest: /etc/cron.d/cloudstack-ldapsync
    owner: root
    mode: "0644"
